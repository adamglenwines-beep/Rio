<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit + user-scalable=no: the page itself must not zoom on pinch,
       the 3D camera handles pinch instead -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7ec3e6" />
  <title>Borgo — a Ligurian village prototype</title>
  <style>
    :root {
      --ink: #3b2f28; --paper: #fbf4e6; --paper-2: #f3e6cc; --accent: #c4643f;
      --green: #2f6b46; --shadow: 0 6px 18px rgba(60, 40, 20, .18);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fcbe9;
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink); overscroll-behavior: none; }
    #app { position: fixed; inset: 0; }
    /* touch-action:none hands every touch gesture to our code (no browser scroll/zoom) */
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .panel { background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); }

    #topbar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
      display: flex; gap: 8px; align-items: center; justify-content: space-between; pointer-events: none; }
    #topbar > * { pointer-events: auto; }
    #title { padding: 8px 14px; font-weight: 800; letter-spacing: .5px; white-space: nowrap; }
    #title small { font-weight: 600; opacity: .65; margin-left: 6px; }
    #version { white-space: nowrap; font-size: 11px; font-weight: 700; margin-left: 8px; padding: 2px 6px; border-radius: 8px; background: var(--paper-2); }
    #speed { display: flex; padding: 4px; gap: 2px; }

    #hint { position: fixed; left: 50%; transform: translateX(-50%);
      top: calc(max(10px, env(safe-area-inset-top)) + 54px);
      padding: 8px 14px; font-size: 14px; max-width: min(92vw, 560px); text-align: center;
      background: rgba(251, 244, 230, .92); }

    #toolbar { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 4px; padding: 6px;
      max-width: calc(100vw - 16px); overflow-x: auto; }
    #side { position: fixed; right: 10px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 84px);
      display: flex; flex-direction: column; gap: 6px; padding: 6px; }

    button { font: inherit; color: inherit; border: 0; background: transparent; border-radius: 12px;
      min-width: 54px; min-height: 54px; padding: 4px 8px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    button .i { font-size: 22px; line-height: 1; }
    button .l { font-size: 11px; font-weight: 700; opacity: .8; white-space: nowrap; }
    button:hover { background: var(--paper-2); }
    button.on { background: var(--accent); color: #fff; }
    button.on .l { opacity: 1; }
    #speed button { min-width: 40px; min-height: 40px; font-size: 16px; font-weight: 800; }
    #side button { min-width: 48px; min-height: 48px; }

    #pathbar { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 84px); display: none; gap: 6px; padding: 6px; }
    #pathbar button { flex-direction: row; min-height: 44px; padding: 4px 14px; font-weight: 800; white-space: nowrap; }
    #pathbar button.primary { background: var(--green); color: #fff; }

    #stats { position: fixed; left: 10px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 84px);
      padding: 8px 12px; font-size: 13px; line-height: 1.45; }
    #stats b { font-variant-numeric: tabular-nums; }
    #stats:empty { display: none; }
    #settings { position: fixed; right: 76px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 84px);
      width: min(340px, calc(100vw - 96px)); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
    #settings[hidden] { display: none; }
    #settings .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
    #settings .row span, #settings .small { font-size: 12px; opacity: .7; }
    #settings .seg { display: flex; gap: 4px; flex-wrap: wrap; }
    #settings .seg button { min-width: 0; min-height: 36px; flex: 1; padding: 4px 6px; font-size: 13px; font-weight: 700;
      background: var(--paper-2); flex-direction: row; }
    #settings .seg button.on { background: var(--accent); color: #fff; }
    #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
      padding: 10px 16px; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 800;
      font-size: 18px; background: #8fcbe9; z-index: 10; }

    @media (max-width: 520px) {
      #title small { display: none; }
      #title { padding: 8px 10px; }
      #speed button { min-width: 32px; padding: 4px 4px; }
      button { min-width: 50px; }
      button .l { font-size: 10px; }
      #stats { font-size: 12px; bottom: auto; top: calc(max(10px, env(safe-area-inset-top)) + 54px); }
      #hint { top: auto; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 140px); font-size: 13px; }
      /* side buttons go icon-only, up top, out of the way of hints & the path bar */
      #side { top: calc(max(10px, env(safe-area-inset-top)) + 110px); bottom: auto; padding: 4px; gap: 2px; }
      #side .l { display: none; }
      #side button { min-width: 44px; min-height: 44px; }
      #settings { right: 10px; left: 10px; width: auto; top: calc(max(10px, env(safe-area-inset-top)) + 110px); bottom: auto; margin-right: 56px; }
    }
  </style>

  <!-- Three.js from a CDN via an import map: no install, no build step. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="loading">Building the cove…</div>

  <div id="topbar">
    <div id="title" class="panel">Borgo<small>a Ligurian village</small><span id="version"></span></div>
    <div id="speed" class="panel">
      <button data-speed="0" title="Pause">❚❚</button>
      <button data-speed="1" title="Play">▶</button>
      <button data-speed="4" title="Fast">▶▶</button>
      <button data-speed="12" title="Very fast">▶▶▶</button>
    </div>
  </div>

  <div id="hint" class="panel"></div>

  <div id="stats" class="panel"></div>

  <div id="side" class="panel">
    <button id="btn-postcard" title="Postcard view from the water"><span class="i">📷</span><span class="l">Postcard</span></button>
    <button id="btn-top" title="Overview"><span class="i">🗺️</span><span class="l">Overview</span></button>
    <button id="btn-slope" title="Show slope bands"><span class="i">⛰️</span><span class="l">Slopes</span></button>
    <button id="btn-demo" title="Lay out a demo village"><span class="i">✨</span><span class="l">Demo</span></button>
    <button id="btn-reset" title="Clear everything"><span class="i">↺</span><span class="l">Reset</span></button>
    <button id="btn-settings" title="Graphics and time of day"><span class="i">⚙️</span><span class="l">Settings</span></button>
  </div>

  <div id="pathbar" class="panel">
    <button id="btn-path-undo">↶ Undo point</button>
    <button id="btn-path-done" class="primary">✓ Finish path</button>
  </div>

  <div id="toolbar" class="panel">
    <button data-tool="view" class="on"><span class="i">✋</span><span class="l">Look</span></button>
    <button data-tool="path"><span class="i">🪜</span><span class="l">Path</span></button>
    <button data-tool="res"><span class="i">🏠</span><span class="l">Homes</span></button>
    <button data-tool="com"><span class="i">🏪</span><span class="l">Shops</span></button>
    <button data-tool="erase"><span class="i">🧽</span><span class="l">Unzone</span></button>
  </div>

  <div id="settings" class="panel" hidden>
    <div class="row"><b>Quality</b><span id="set-auto-note"></span></div>
    <div class="seg" id="set-quality">
      <button data-q="auto">Auto</button><button data-q="low">Low</button><button data-q="medium">Medium</button><button data-q="high">High</button>
    </div>
    <div class="row"><b>Resolution</b></div>
    <div class="seg" id="set-res">
      <button data-r="1">100%</button><button data-r="0.85">85%</button><button data-r="0.7">70%</button><button data-r="0.5">50%</button>
    </div>
    <div class="row"><b>Time of day</b></div>
    <div class="seg" id="set-time">
      <button data-t="midday">Midday</button><button data-t="golden">Golden hour</button><button data-t="dusk">Dusk</button><button data-t="night">Night</button>
    </div>
    <div class="row small" id="set-fps"></div>
  </div>

  <div id="toast" class="panel"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
